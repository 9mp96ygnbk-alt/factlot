swagger: "2.0"
info:
  title: FactLot
  description: >-
    The open fact layer for commercial real estate AI agents. Deterministic CRE calculators
    (rent schedules, NER, proposal comparison, CAM reconciliation, percentage rent, loan sizing,
    WALT, NPV, IRR) with audit trails, canonical FactLot IDs, and cited-fact validation, served
    over the Model Context Protocol.
  version: 0.2.0
  contact:
    name: FactLot
    url: https://factlot.com
host: YOUR-FACTLOT-HOST
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /mcp:
    post:
      summary: FactLot MCP server
      description: Streamable HTTP MCP endpoint exposing the FactLot tool catalog.
      operationId: InvokeFactLotMCP
      x-ms-agentic-protocol: mcp-streamable-1.0
      responses:
        "200":
          description: Success
# If the server sets FACTLOT_API_KEY, uncomment and supply "Bearer <key>" when creating the connection:
# securityDefinitions:
#   api_key:
#     type: apiKey
#     in: header
#     name: Authorization
# security:
#   - api_key: []
