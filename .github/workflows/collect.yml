# Weekly archive of public property and entity data for the FactLot Registry, every state.
#   discover  — every source: lists download links on its landing pages (downloads nothing)
#   snapshot  — verified sources only (terms reviewed, files confirmed; data policy §5)
# Sources are the config files under registry/sources/ (one per state or per source). Archived
# files are published as release assets with hash manifests, so history accumulates.
name: Collect public data

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Limit to these source ids (comma-separated); empty = all"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Write access only to publish the release. The token is given to the two gh steps alone, never
    # to the steps that download and parse publishers' files, and is not left in .git/config.
    permissions:
      contents: write
    env:
      PYTHONPATH: python/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Restore previous manifests (for conditional requests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p collected
          latest=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("data-"))][0].tagName // empty')
          if [ -n "$latest" ]; then
            gh release download "$latest" --pattern '*__manifest.jsonl' --dir restore || true
            for f in restore/*__manifest.jsonl; do
              [ -e "$f" ] || continue
              src=$(basename "$f" __manifest.jsonl)
              mkdir -p "collected/$src" && cp "$f" "collected/$src/manifest.jsonl"
            done
          fi

      # The input reaches the shell only through an environment variable (never ${{ }} inside run:),
      # and each id must look like a source id before it becomes an argument.
      - name: Source filter
        id: filter
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          args=""
          IFS=',' read -ra ids <<< "$ONLY"
          for id in "${ids[@]}"; do
            id="${id//[[:space:]]/}"
            [ -z "$id" ] && continue
            if ! [[ "$id" =~ ^[a-z0-9][a-z0-9._-]{0,99}$ ]]; then
              echo "::error::invalid source id in 'only' (expected lowercase letters, digits, . _ -)"
              exit 1
            fi
            args="$args --source $id"
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Discover download links (no downloads)
        env:
          SOURCE_ARGS: ${{ steps.filter.outputs.args }}
        # SOURCE_ARGS is unquoted on purpose: validated "--source <id>" pairs, split into words.
        run: |
          # SOURCE_ARGS is a validated list of --source flags and must split into words.
          # shellcheck disable=SC2086
          python -m factlot.collector discover --config registry/sources --out collected $SOURCE_ARGS

      - name: Snapshot verified sources
        env:
          SOURCE_ARGS: ${{ steps.filter.outputs.args }}
        run: |
          # SOURCE_ARGS is a validated list of --source flags and must split into words.
          # shellcheck disable=SC2086
          python -m factlot.collector snapshot --config registry/sources --out collected $SOURCE_ARGS

      - name: Upload discovery reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discovery-${{ github.run_id }}
          path: collected/*/discovered.json
          retention-days: 90

      - name: Publish new snapshots as a release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import pathlib, shutil
          out = pathlib.Path("release"); out.mkdir()
          for src in pathlib.Path("collected").iterdir():
              if not src.is_dir():
                  continue
              for f in src.glob("*/*"):
                  if f.parent.name.startswith("."):
                      continue
                  shutil.copy(f, out / f"{src.name}__{f.parent.name}__{f.name}")
              m = src / "manifest.jsonl"
              if m.exists():
                  shutil.copy(m, out / f"{src.name}__manifest.jsonl")
          PY
          if ! ls release/*__*__* >/dev/null 2>&1; then echo "No new files archived this run."; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          gh release create "data-$day-$RUN_ID" release/* \
            --title "Public data snapshot $day" \
            --notes "Archived by the FactLot collector. Each source's manifest lists URL, sha256, retrieval time, HTTP validators, and robots status for every file. Sources: the config files under registry/sources/."
