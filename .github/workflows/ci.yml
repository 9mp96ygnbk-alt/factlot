name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python-and-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Python SDK tests (shared vectors)
        run: npm run test:python
      - name: FactLot Bench offline tests
        run: npm run test:bench
      - name: Connector tests (Bedrock Agents Lambda)
        run: npm run test:connectors
      - name: Build and validate the Claude Desktop extension
        run: npm run build && npm run build:mcpb
      - name: Generated schemas are up to date
        run: npm run schemas:check
      - name: TypeScript vs Python differential test
        run: npm run differential -- 1 3000
