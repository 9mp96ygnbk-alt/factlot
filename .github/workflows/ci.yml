name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build factlot.com (checks numbers, links, and that nothing loads from another origin)
        run: npm run build:site -- "$RUNNER_TEMP/site"

  python-and-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      # The SDK's optional extras, so the real-PDF and Ed25519 signature tests run (and the
      # differential includes signed fact packages): factlot[pdf] and factlot[signing].
      - name: Optional Python extras (pypdf, cryptography)
        run: python -m pip install pypdf==6.19.0 cryptography==46.0.5
      - name: Python SDK tests (shared vectors)
        run: npm run test:python
      - name: FactLot Bench offline tests
        run: npm run test:bench
      - name: Connector tests (Bedrock Agents Lambda)
        run: npm run test:connectors
      - name: Build and validate the Claude Desktop extension
        run: npm run build && npm run build:mcpb
      - name: End-to-end MCP test (stdio, Streamable HTTP, REST, OpenAPI)
        run: npm run test:e2e
      - name: End-to-end MCP test of the packed extension
        run: |
          npx mcpb unpack dist/factlot.mcpb "$RUNNER_TEMP/mcpb"
          FACTLOT_E2E_ONLY=stdio FACTLOT_E2E_STDIO="[\"node\",\"$RUNNER_TEMP/mcpb/server/index.mjs\"]" npm run test:e2e
      - name: OpenAPI documents are valid (Redocly, spec rules only)
        env:
          REDOCLY_TELEMETRY: "off"
        run: npx -y @redocly/cli@2.72.1 lint --extends=spec spec/schemas/openapi-3.1.json spec/schemas/openapi-3.0.json
      - name: Generated schemas are up to date
        run: npm run schemas:check
      - name: TypeScript vs Python differential test
        run: npm run differential -- 1 3000
