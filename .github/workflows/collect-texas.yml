# Weekly archive of Texas public property data for the FactLot Registry.
#   discover  — every source: lists download links on its landing pages (downloads nothing)
#   snapshot  — verified sources only (terms reviewed, files confirmed; data policy §5)
# Archived files are published as release assets with hash manifests, so history accumulates.
name: Collect Texas public data

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-texas
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: python/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous manifests (for conditional requests)
        run: |
          mkdir -p collected
          latest=$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("data-tx-"))][0].tagName // empty')
          if [ -n "$latest" ]; then
            gh release download "$latest" --pattern '*__manifest.jsonl' --dir restore || true
            for f in restore/*__manifest.jsonl; do
              [ -e "$f" ] || continue
              src=$(basename "$f" __manifest.jsonl)
              mkdir -p "collected/$src" && cp "$f" "collected/$src/manifest.jsonl"
            done
          fi

      - name: Discover download links (no downloads)
        run: python -m factlot.collector discover --config registry/sources/texas.json --out collected

      - name: Snapshot verified sources
        run: python -m factlot.collector snapshot --config registry/sources/texas.json --out collected

      - name: Upload discovery reports
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}
          path: collected/*/discovered.json
          retention-days: 90

      - name: Publish new snapshots as a release
        run: |
          python - <<'PY'
          import pathlib, shutil
          out = pathlib.Path("release"); out.mkdir()
          for src in pathlib.Path("collected").iterdir():
              if not src.is_dir():
                  continue
              for f in src.glob("*/*"):
                  if f.parent.name.startswith("."):
                      continue
                  shutil.copy(f, out / f"{src.name}__{f.parent.name}__{f.name}")
              m = src / "manifest.jsonl"
              if m.exists():
                  shutil.copy(m, out / f"{src.name}__manifest.jsonl")
          PY
          if ! ls release/*__*__* >/dev/null 2>&1; then echo "No new files archived this run."; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          gh release create "data-tx-$day-${{ github.run_id }}" release/* \
            --title "Texas public data snapshot $day" \
            --notes "Archived by the FactLot collector. Each source's manifest lists URL, sha256, retrieval time, HTTP validators, and robots status for every file."
