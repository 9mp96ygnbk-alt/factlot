# The site lives at https://factlot.com (Cloudflare, `npm run deploy:cloudflare`). The old GitHub
# Pages address, 9mp96ygnbk-alt.github.io/factlot, now serves only a redirect to it, so search
# engines and old links do not find a second, stale copy of the site.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package the redirect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage the redirect
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          page='<!doctype html><html lang="en"><head><meta charset="utf-8"><title>FactLot</title><link rel="canonical" href="https://factlot.com/"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=https://factlot.com/"></head><body><p>FactLot has moved to <a href="https://factlot.com/">factlot.com</a>.</p></body></html>'
          printf '%s\n' "$page" > "$RUNNER_TEMP/site/index.html"
          cp "$RUNNER_TEMP/site/index.html" "$RUNNER_TEMP/site/404.html"
          printf 'User-agent: *\nAllow: /\n' > "$RUNNER_TEMP/site/robots.txt"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to Pages
      id-token: write # verify the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
