# Deploys the static landing page in site/ to GitHub Pages when it changes on main.
#
# One-time setup by a repository admin: Settings, Pages, Build and deployment, Source
# "GitHub Actions". Pages on a private repository needs a paid plan, so this works for free once
# the repository is public. For factlot.com, add the custom domain in the same settings page and
# point DNS at GitHub Pages; no CNAME file is needed with Actions deployments.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package site/
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The site is plain files with no build step. Leave out the folder's own notes
      # (README.md), which is for maintainers, not visitors.
      - name: Stage the site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude '*.md' site/ "$RUNNER_TEMP/site/"
          test -f "$RUNNER_TEMP/site/index.html"
          find "$RUNNER_TEMP/site" -type f | sort
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to Pages
      id-token: write # verify the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
