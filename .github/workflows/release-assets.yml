# Builds every installable artifact for a tagged version and attaches it to the GitHub release
# vX.Y.Z (creating the release if it does not exist yet), with SHA256SUMS. Needs no accounts:
# only the repository's own GITHUB_TOKEN. This is what makes FactLot installable before the npm
# and PyPI packages exist:
#
#   factlot-X.Y.Z.mcpb                      Claude Desktop extension (also the MCP Registry mcpb package)
#   factlot-mcp-standalone-X.Y.Z.tgz        npx -y <url>: the stdio MCP server, dependencies bundled
#   factlot-{schema,id,calc,tools,mcp,server}-X.Y.Z.tgz
#                                           npm install <url> ...: the six npm packages as npm pack wrote them
#   factlot-X.Y.Z-py3-none-any.whl, factlot-X.Y.Z.tar.gz
#                                           pip install <url>: the Python SDK
#   SHA256SUMS                              sha256sum -c SHA256SUMS
#
# Trigger: push a tag vX.Y.Z that matches the package versions (docs/release-process.md), or run it
# by hand on an existing tag to rebuild and replace the assets. It runs next to release.yml, which
# publishes to npm and PyPI once their accounts exist and stops in its preflight until
# then; this workflow does not depend on it.
name: Release assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets for, e.g. v0.1.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test the release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: The tag matches every package version
        id: version
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::$TAG is not a vX.Y.Z tag"; exit 1 ;; esac
          version="${TAG#v}"
          for p in schema id calc tools mcp server; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$version" ] || { echo "::error::packages/$p is $v, tag is $TAG"; exit 1; }
          done
          py=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' python/pyproject.toml)
          [ "$py" = "$version" ] || { echo "::error::python/pyproject.toml is $py, tag is $TAG"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build
      - name: End-to-end test of the built servers (stdio and HTTP MCP, REST, OpenAPI)
        run: npm run test:e2e

      - name: npm package tarballs
        run: |
          mkdir -p release
          for p in schema id calc tools mcp server; do
            npm pack "./packages/$p" --pack-destination release
          done

      - name: Claude Desktop extension and the standalone npx tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MCPB_SIGNING_CERT: ${{ secrets.MCPB_SIGNING_CERT }}
          MCPB_SIGNING_KEY: ${{ secrets.MCPB_SIGNING_KEY }}
        run: |
          npm run build:mcpb
          cp dist/factlot.mcpb "release/factlot-$VERSION.mcpb"
          if [ -n "$MCPB_SIGNING_CERT" ] && [ -n "$MCPB_SIGNING_KEY" ]; then
            printf '%s\n' "$MCPB_SIGNING_CERT" > "$RUNNER_TEMP/cert.pem"
            printf '%s\n' "$MCPB_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
            npx mcpb sign "release/factlot-$VERSION.mcpb" --cert "$RUNNER_TEMP/cert.pem" --key "$RUNNER_TEMP/key.pem"
            npx mcpb verify "release/factlot-$VERSION.mcpb"
            rm -f "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/key.pem"
          else
            echo "::notice::MCPB_SIGNING_CERT / MCPB_SIGNING_KEY are not set; the .mcpb is attached unsigned."
          fi
          node scripts/release/pack-standalone.mjs release

      - name: Python wheel and sdist
        run: |
          python -m pip install build==1.6.1
          python -m build --outdir release python

      - name: Install each asset the way a user would, and test it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scratch="$RUNNER_TEMP/install"
          mkdir -p "$scratch/mcpb" "$scratch/npm" "$scratch/standalone"

          # .mcpb: unpack the archive and drive the bundled server over stdio.
          npx mcpb unpack "release/factlot-$VERSION.mcpb" "$scratch/mcpb"
          npx mcpb validate "$scratch/mcpb/manifest.json"
          FACTLOT_E2E_ONLY=stdio FACTLOT_E2E_STDIO="[\"node\",\"$scratch/mcpb/server/index.mjs\"]" npm run test:e2e

          # Standalone tarball: install it with no other packages and run its bin.
          (cd "$scratch/standalone" && npm init -y > /dev/null && npm install --no-audit --no-fund "$GITHUB_WORKSPACE/release/factlot-mcp-standalone-$VERSION.tgz")
          FACTLOT_E2E_ONLY=stdio FACTLOT_E2E_STDIO="[\"$scratch/standalone/node_modules/.bin/factlot-mcp\"]" npm run test:e2e

          # The six npm tarballs together, in a project that has never seen the monorepo.
          tarballs=()
          for p in schema id calc tools mcp server; do tarballs+=("$GITHUB_WORKSPACE/release/factlot-$p-$VERSION.tgz"); done
          (cd "$scratch/npm" && npm init -y > /dev/null && npm install --no-audit --no-fund "${tarballs[@]}")
          FACTLOT_E2E_ONLY=stdio FACTLOT_E2E_STDIO="[\"$scratch/npm/node_modules/.bin/factlot-mcp\"]" npm run test:e2e

          # Python wheel and sdist, each in a fresh virtual environment.
          for dist in "release/factlot-$VERSION-py3-none-any.whl" "release/factlot-$VERSION.tar.gz"; do
            python -m venv "$scratch/venv" && "$scratch/venv/bin/pip" install --quiet "$dist"
            "$scratch/venv/bin/python" -I scripts/e2e/python_smoke.py "$VERSION"
            rm -rf "$scratch/venv"
          done

      - name: Checksums and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          if ! node scripts/release/changelog.mjs notes "$VERSION" > notes.md 2> /dev/null; then
            printf 'FactLot %s.\n\nSee CHANGELOG.md for changes.\n' "$VERSION" > notes.md
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ steps.version.outputs.version }}
          path: |
            release
            notes.md
          if-no-files-found: error
          retention-days: 30

  attach:
    name: Attach to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ needs.build.outputs.version }}
          path: .
      - name: Create or update the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            gh release upload "$TAG" release/* --clobber
          else
            prerelease=""
            case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --verify-tag $prerelease \
              --title "FactLot $VERSION" --notes-file notes.md release/*
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
