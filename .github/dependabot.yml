# Weekly dependency updates for the npm workspaces, the Python package, the Actions used by the
# workflows (pinned to commit SHAs; Dependabot updates the SHA and the version comment), and the
# Docker base image. Internal @factlot/* pins are managed by scripts/release/bump.mjs, not here.
# The cooldown waits a week after a release before proposing it, so a hijacked version is
# usually caught and pulled before it reaches a pull request here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@factlot/*"
      # Major TypeScript updates are taken deliberately: 7.x fails lint, typecheck, and the build.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    labels: ["dependencies"]

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: ["dependencies"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
